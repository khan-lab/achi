<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Achi — a browser-based framework for comparing, annotating and interpreting genomic intervals</title>
    <meta
      name="description"
      content="Intersect, annotate and test genomic region sets (BED, narrowPeak, VCF) for enrichment entirely in your browser with bedtools compiled to WebAssembly. No data upload, no login: safe for patient and other sensitive data."
    />
    <meta
      name="keywords"
      content="genomic intersection, UpSet plot, Venn diagram, bedtools, WebAssembly, BED, narrowPeak, VCF, ChIP-seq, region annotation, enrichment analysis, GO enrichment, GREAT, Cistrome-GO, privacy, no data upload"
    />
    <meta name="author" content="Aziz Khan" />
    <meta name="application-name" content="Achi" />
    <link rel="canonical" href="https://khan-lab.github.io/achi/" />

    <!-- Privacy: links to other sites (AmiGO, DOIs) do not send this page's URL as referrer. -->
    <meta name="referrer" content="no-referrer" />
    <!-- Stop iOS turning region counts and coordinates into phone-number links. -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Icons and browser chrome (the app has a light theme only) -->
    <link rel="icon" type="image/svg+xml" href="/hispar-v2-icon.svg" />
    <link rel="icon" type="image/png" sizes="600x600" href="/achi-icon-mobile.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />

    <!-- Home-screen icon and app mode: iPhone/iPad (apple-*), Android and desktop (manifest) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Achi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta property="og:title" content="Achi — comparing, annotating and interpreting genomic intervals in the browser" />
    <meta
      property="og:description"
      content="Intersect, annotate and test genomic region sets for enrichment in your browser with bedtools in WebAssembly. Files are never uploaded."
    />

    />
    <meta name="twitter:image" content="https://khan-lab.github.io/achi/achi-social.png" />
    <meta name="twitter:image:alt" content="Achi" />
